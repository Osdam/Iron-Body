; ─────────────────────────────────────────────────────────────────────────────
; IRON BODY · Worker del laboratorio de IA de ULTRON STUDIO (Hito 4)
;
; Contrato: docs/ultron-studio/ULTRON_STUDIO_H4_CONTRACT.md §A3 y decisión 4 del
; lead. Fichero APARTE de `ironbody-workers.conf` a propósito: instalarlo (o
; retirarlo) es `supervisorctl reread && supervisorctl update`, que solo arranca
; o para ESTE programa; los otros doce no se reinician.
;
; Atiende el carril P5 `studio-lab`: un paso de una ejecución del laboratorio por
; trabajo (`App\Services\UltronStudio\StudioLabStepJob`), como mucho un caso con
; dos llamadas al proveedor. Es una SIMULACIÓN DEL STUDIO, no el agente: el motor
; no lee nada de esto y su lentitud no es la de ningún carril del motor.
;
; Se instala en la fase 1 con la bandera APAGADA (ULTRON_STUDIO_LAB_ENABLED=false):
; sin trabajos que hacer, duerme; `queue:health` ve el carril atendido.
;
;  - PRIMER ARGUMENTO = CONEXIÓN `lab`: de ella sale `retry_after` = 300, MAYOR
;    que el --timeout de 150. `queue:work database` habría usado 90.
;  - --tries=1: un reintento de la cola podría pagar dos veces la misma llamada.
;    Un paso que falla o caduca lo liquida `failed()` (coste = su reserva).
;  - --timeout=150: dos llamadas de 60 s caben con margen.
;  - numprocs=1: un caso a la vez en todo el sistema (además lo garantiza el
;    propio runner).
;  - --sleep=3: el carril pasa días vacío; no hace falta mirar la tabla cada
;    segundo.
;  - stopwaitsecs=180 > timeout: al parar, la llamada en vuelo termina (y queda
;    liquidada) en vez de cortarse a mitad.
;  - user=www-data: la caché de configuración es de www-data (memoria
;    config-cache-y-los-workers: chmod 600 sin chown deja los workers en BACKOFF).
; ─────────────────────────────────────────────────────────────────────────────

[program:ironbody-lab]
process_name=%(program_name)s_%(process_num)02d
command=/usr/bin/php /var/www/api/backend/artisan queue:work lab --queue=studio-lab --sleep=3 --tries=1 --timeout=150 --max-jobs=100 --max-time=3600
directory=/var/www/api/backend
autostart=true
autorestart=true
startsecs=5
startretries=10
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/api/backend/storage/logs/worker-lab.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
stopwaitsecs=180
environment=APP_ENV="production",HOME="/var/www",USER="www-data"
