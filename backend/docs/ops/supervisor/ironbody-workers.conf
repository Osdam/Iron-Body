; ─────────────────────────────────────────────────────────────────────────────
; IRON BODY · Workers de cola por carril
;
; Sustituye a `ironbody-queue-worker.conf`, que tenía UN proceso para toda la
; cola `default`. La fase F.6 midió por qué eso no aguanta: con el agente
; encendido el rendimiento caía de 4,46 a 0,52 trabajos por segundo y una ráfaga
; de cincuenta mensajes dejaba al último esperando minuto y medio. El cuello no
; era CPU (2,5 %) ni memoria (45 MB): era un proceso bloqueado esperando a
; OpenAI mientras el mensaje del siguiente cliente no llegaba a guardarse.
;
; Cinco carriles, por prioridad de quién espera al otro lado:
;
;   P0  whatsapp-high  persistir el mensaje entrante y mover estados
;   P2  agent          el modelo: lento por definición, aislado por diseño
;   P3  media          descargas y subidas; un vídeo tarda lo que tarda
;   P4  commercial     eventos, oportunidades, alertas y analítica
;   P4  billing        facturación electrónica (systemd, ver runbook)
;
; PRIMER ARGUMENTO = CONEXIÓN, y no es decorativo: de la conexión sale el
; `retry_after`, que es el tiempo tras el cual la cola da por muerto un trabajo
; reservado y deja que otro worker lo tome. Tiene que ser MAYOR que el
; `--timeout` de este worker; si no, un trabajo lento sigue corriendo mientras un
; segundo lo empieza de nuevo: dos respuestas al mismo cliente, o dos facturas
; con dos números fiscales. `queue:work whatsapp` usa retry_after=120 contra
; timeout=60; `queue:work database` habría usado 90, y con el carril del agente
; a timeout=240 eso era el agujero.
;
; --max-jobs y --max-time reciclan el proceso: PHP acumula memoria en procesos
; largos, y un worker reiniciado cada hora es más barato que uno que crece toda
; la semana. Supervisor lo vuelve a levantar en el acto.
;
; --sleep=1 y no 0: sin cola, un worker con sleep=0 gira consultando la base y
; se come una CPU entera sin hacer nada.
; ─────────────────────────────────────────────────────────────────────────────

; ── P0 · Entrada de WhatsApp ─────────────────────────────────────────────────
; Cuatro procesos. Es el único carril con un compromiso de espera duro (p95 ≤ 500
; ms) porque es el único donde hay una persona mirando el teléfono. El trabajo es
; corto —guardar y encolar, 19 ms medidos— así que los procesos están para
; absorber la ráfaga, no para el caudal.
;
; El cuarto se añadió por margen, no por necesidad: medido sobre una ráfaga de
; 100 trabajos mixtos, tres dan p95 = 391 ms (22 % de margen) y cuatro dan 246 ms
; (51 %). Con la CPU al 0,8 % y 55 MB por proceso, comprar margen en el único
; carril donde alguien espera una respuesta es prácticamente gratis.
[program:ironbody-whatsapp]
process_name=%(program_name)s_%(process_num)02d
command=/usr/bin/php /var/www/api/backend/artisan queue:work whatsapp --queue=whatsapp-high --sleep=1 --tries=3 --timeout=60 --max-jobs=1000 --max-time=3600
directory=/var/www/api/backend
autostart=true
autorestart=true
startsecs=5
startretries=10
stopasgroup=true
killasgroup=true
user=www-data
numprocs=4
redirect_stderr=true
stdout_logfile=/var/www/api/backend/storage/logs/worker-whatsapp.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
; Menor que el timeout+margen: al parar, se le da tiempo a terminar lo que tiene
; entre manos en vez de matarlo a mitad de una escritura.
stopwaitsecs=90
environment=APP_ENV="production",HOME="/var/www",USER="www-data"

; ── P2 · El agente ───────────────────────────────────────────────────────────
; Cuatro procesos. Cada trabajo son ~2,77 s de espera al modelo, así que aquí los
; procesos SÍ son caudal: cuatro dan ~1,4 trabajos/s. Medido, la espera p95 del
; carril en una ráfaga de 100 baja de 49,8 s con tres a 38,7 s con cuatro.
;
; Sigue siendo lento, y está bien: el compromiso de este carril son 30 s, no
; medio segundo. Lo que importa es que esa lentitud ya no es la de nadie más.
[program:ironbody-agent]
process_name=%(program_name)s_%(process_num)02d
command=/usr/bin/php /var/www/api/backend/artisan queue:work agent --queue=agent --sleep=1 --tries=3 --timeout=240 --max-jobs=250 --max-time=3600
directory=/var/www/api/backend
autostart=true
autorestart=true
startsecs=5
startretries=10
stopasgroup=true
killasgroup=true
user=www-data
numprocs=4
redirect_stderr=true
stdout_logfile=/var/www/api/backend/storage/logs/worker-agent.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
stopwaitsecs=270
environment=APP_ENV="production",HOME="/var/www",USER="www-data"

; ── P3 · Multimedia ──────────────────────────────────────────────────────────
; Dos procesos y timeout largo: un vídeo de 50 MB por la CDN de Meta puede
; tardar minutos, y ese tiempo no puede vencer el timeout ni tocar otro carril.
[program:ironbody-media]
process_name=%(program_name)s_%(process_num)02d
command=/usr/bin/php /var/www/api/backend/artisan queue:work media --queue=media --sleep=1 --tries=3 --timeout=420 --max-jobs=200 --max-time=3600
directory=/var/www/api/backend
autostart=true
autorestart=true
startsecs=5
startretries=10
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/api/backend/storage/logs/worker-media.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
stopwaitsecs=450
environment=APP_ENV="production",HOME="/var/www",USER="www-data"

; ── P4 · Comercial ───────────────────────────────────────────────────────────
; Dos procesos. Nadie está esperando esto: puede acumular cola sin que a nadie
; le pase nada, y por eso su compromiso de espera son cinco minutos.
[program:ironbody-commercial]
process_name=%(program_name)s_%(process_num)02d
command=/usr/bin/php /var/www/api/backend/artisan queue:work commercial --queue=commercial --sleep=1 --tries=3 --timeout=120 --max-jobs=500 --max-time=3600
directory=/var/www/api/backend
autostart=true
autorestart=true
startsecs=5
startretries=10
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/api/backend/storage/logs/worker-commercial.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
stopwaitsecs=150
environment=APP_ENV="production",HOME="/var/www",USER="www-data"
