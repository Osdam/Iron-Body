; ─────────────────────────────────────────────────────────────────────────────
; IRON BODY · Worker de la voz y la telefonía de ULTRON STUDIO (Hito 8)
;
; BORRADOR (OPS8-a, 03-11-2026). NO ESTÁ INSTALADO en ningún servidor y no se
; instala sin la orden del propietario: entra con el despliegue de la fase 1
; del H8 (OPS8-b), con TODAS las banderas apagadas. Lo ensaya el banco local:
; `ensayar.sh <banco> worker revisar|comprobar|instalar|retirar`
; (docs/ultron-studio/ops/banco-h8/).
;
; Contrato: docs/ultron-studio/ULTRON_STUDIO_H8_CONTRACT.md, D8-4 (carril
; propio `voice` con este worker; NUNCA el del puente de n8n, `commercial`, ni
; el del laboratorio, `studio-lab`) y D8-12 (el job de la saliente con tries=1,
; sin retry() y un plazo de 30 s; un resultado `ambiguous` no se reintenta: lo
; resuelve la conciliación).
;
; Fichero APARTE de `ironbody-workers.conf`, como `ironbody-lab.conf`: instalarlo
; o retirarlo es `supervisorctl reread && supervisorctl update`, que solo
; arranca o para ESTE programa; los otros trece no se reinician. Con él
; instalado, `supervisorctl status` enseña 14 programas RUNNING (no 13): el
; despliegue del H8 tiene que esperar 13 antes y 14 después.
;
; Atiende el carril `voice`: PlaceOutboundVoiceCall (UNA petición a
; ElevenLabs por trabajo, sin reintentos ni redirecciones) y lo que B8 ponga
; en el carril. Con VOICE_OUTBOUND_ENABLED=false (fase 1 y 2) no hay trabajos:
; duerme, y `queue:health` ve el carril atendido si está en `lanes`.
;
; REQUISITO PREVIO, fuera de este fichero (no tiene dueño en la tabla de
; paquetes del contrato: lo asigna el lead): `config/queue.php` necesita
;   - la conexión `voice` (driver database, cola `voice`, retry_after MAYOR que
;     el mayor de --timeout y el $timeout del job; p. ej. 120) y
;   - su entrada en `lanes` (para `queue:health` y el monitor).
; Sin la conexión, `queue:work voice` muere al arrancar («The [voice] queue
; connection has not been configured») y supervisor lo deja en FATAL tras
; startretries. El despliegue tiene que comprobarlo ANTES de copiar este
; fichero (p. ej. `php artisan config:show queue.connections.voice`), y el
; banco lo comprueba con `ensayar.sh <banco> worker comprobar`.
;
;  - PRIMER ARGUMENTO = CONEXIÓN `voice`: de ella sale `retry_after`. Con
;    `queue:work database` valdría 90, sin relación con este carril.
;  - --tries=1: un reintento de la cola podría MARCAR DOS VECES al mismo número
;    (R-5). Un trabajo que falla o caduca lo liquida `failed()`: la fila pasa a
;    `ambiguous` o `failed_to_start` y la reserva de coste se resuelve.
;  - --timeout=60: el job se da 30 s (D8-12). 60 deja margen para el arranque del
;    framework y para escribir el resultado; si el job declara su `$timeout`,
;    manda el del job. retry_after (120) > 60.
;  - numprocs=1: VOICE_MAX_CONCURRENT_CALLS=1 por defecto (D8-15); una saliente
;    a la vez en todo el sistema. Subirlo exige subir la concurrencia y tener
;    medido el carril (PERF8); el cerrojo por contacto y los UNIQUE de la base
;    siguen siendo la garantía, no el número de procesos.
;  - --sleep=1: alguien pulsó «llamar» en el CRM; recogerlo en ≤ 1 s cuesta un
;    SELECT por segundo, como los workers de WhatsApp.
;  - --max-jobs=200 --max-time=3600: se recicla cada hora, como los demás.
;  - stopwaitsecs=90 > timeout: al parar, la petición en vuelo termina y queda
;    registrada (dialing, failed_to_start o ambiguous) en vez de cortarse a
;    mitad, que dejaría la fila en `requested` sin saber si ElevenLabs marcó.
;  - user=www-data: la caché de configuración es de www-data en 600 (memoria
;    config-cache-y-los-workers: chmod 600 sin chown deja los workers en
;    BACKOFF).
;  - Sin variables propias en `environment=`: las piezas de la voz se leen del
;    fichero de entorno del servidor, como el resto de la aplicación, y no
;    aparecen en `ps` ni en la configuración de supervisor.
;
; Instalar (fase 1, con orden del propietario; lo hace el despliegue del H8):
;   cp /var/www/api/backend/docs/ops/supervisor/ironbody-voice.conf /etc/supervisor/conf.d/
;   supervisorctl reread && supervisorctl update && supervisorctl status ironbody-voice:
; Retirar (vuelta atrás; no toca a los otros trece):
;   supervisorctl stop ironbody-voice: && rm -f /etc/supervisor/conf.d/ironbody-voice.conf
;   supervisorctl reread && supervisorctl update
;   (Los trabajos que queden en la cola `voice` se quedan en `jobs`: sin worker
;   no se atienden. Antes de retirarlo, VOICE_OUTBOUND_ENABLED=false — el nivel
;   0 de D8-20 — para que no entren más.)
; ─────────────────────────────────────────────────────────────────────────────

[program:ironbody-voice]
process_name=%(program_name)s_%(process_num)02d
command=/usr/bin/php /var/www/api/backend/artisan queue:work voice --queue=voice --sleep=1 --tries=1 --timeout=60 --max-jobs=200 --max-time=3600
directory=/var/www/api/backend
autostart=true
autorestart=true
startsecs=5
startretries=10
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/api/backend/storage/logs/worker-voice.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
stopwaitsecs=90
environment=APP_ENV="production",HOME="/var/www",USER="www-data"
